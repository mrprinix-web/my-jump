<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Jump</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:inherit}
html,body{height:100%}
body{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#111,#222,#000);overflow:hidden;font-family:Arial,sans-serif;touch-action:none}
#wrap{position:relative;display:flex;justify-content:center;align-items:center;width:100%;height:100%}
canvas{height:100%;max-width:100%;aspect-ratio:3/5;object-fit:contain;border-radius:20px;box-shadow:0 0 30px red;background:linear-gradient(#222,#111)}
#gameOver{position:absolute;color:#fff;text-align:center;display:none;background:rgba(0,0,0,.75);padding:24px 32px;border-radius:16px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
button{margin-top:15px;padding:12px 25px;border:none;border-radius:10px;background:red;color:#fff;cursor:pointer;font-size:18px}
</style>
</head>

s0vWWrOPXP+RI1atXXdmoRScnR3NHKqIHbFr5zYU/QJjXCMaiaK9bZJOJ5vXtLU13/+2S9/806uuu2pzTaYfz7w15/8DvWfLu/2Fg2gAAAAASUVORK5CYII=";

let score,player,platforms,running,particles,pop,sq,tilt,dir,camY;
const gravity=0.45,jumpForce=-13;
const keys={};

function reset(){
  score=0;pop=0;sq=0;tilt=0;dir=1;camY=0;particles=[];
  player={x:170,y:510,w:80,h:98,vx:0,vy:jumpForce};
  platforms=[{x:150,y:620,w:120,h:15,dip:0}];
  for(let i=0;i<9;i++)platforms.push({x:Math.random()*320,y:i*75,w:100,h:15,dip:0});
  document.getElementById("gameOver").style.display="none";
  running=true;
}

document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);
function pointer(e){
  if(!(e.buttons||e.pointerType==="touch"))return;
  const r=canvas.getBoundingClientRect();
  const left=e.clientX<r.left+r.width/2;
  keys.ArrowLeft=left;keys.ArrowRight=!left;
}
canvas.addEventListener("pointerdown",pointer);
canvas.addEventListener("pointermove",pointer);
["pointerup","pointercancel","pointerleave"].forEach(t=>canvas.addEventListener(t,()=>{keys.ArrowLeft=false;keys.ArrowRight=false}));

function puff(x,y){
  for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*2.5,life:1,r:3+Math.random()*4});
}

function update(){
  let ax=0;
  if(keys.ArrowLeft||keys.a)ax=-6;
  if(keys.ArrowRight||keys.d)ax=6;
  player.vx+=(ax-player.vx)*0.25;
  player.x+=player.vx;
  if(ax!==0)dir=ax>0?1:-1;
  if(player.x<-player.w)player.x=canvas.width;
  if(player.x>canvas.width)player.x=-player.w;

  player.vy+=gravity;
  player.y+=player.vy;

  platforms.forEach(p=>{
    if(player.vy>0&&player.x+player.w-15>p.x&&player.x+15<p.x+p.w&&
       player.y+player.h>p.y&&player.y+player.h<p.y+p.h+20){
      player.vy=jumpForce;
      sq=-0.32;p.dip=1;
      puff(player.x+player.w/2,p.y);
    }
  });

  if(player.y<250){
    const move=Math.abs(player.vy);
    player.y+=move;camY+=move*0.3;
    platforms.forEach(p=>{
      p.y+=move;
      if(p.y>canvas.height){p.y=0;p.x=Math.random()*320;score++;pop=1}
    });
  }

  const target=Math.max(-0.2,Math.min(0.28,-player.vy*0.02));
  sq+=(target-sq)*0.18;
  tilt+=(player.vx*0.035-tilt)*0.2;
  pop*=0.9;
  platforms.forEach(p=>p.dip*=0.85);
  particles.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.1;q.life-=0.03});
  particles=particles.filter(q=>q.life>0);

  if(player.y>canvas.height){
    running=false;
    document.getElementById("finalScore").innerText="Очки: "+score;
    document.getElementById("gameOver").style.display="block";
  }
}

function drawBackground(){
  for(let i=0;i<40;i++){
    const par=0.4+(i%3)*0.3;
    const y=((i*91)+camY*par)%canvas.height;
    ctx.fillStyle="rgba(255,60,60,"+(0.15+(i%3)*0.12)+")";
    ctx.beginPath();
    ctx.arc((i*37)%canvas.width,y,1.5+(i%3)*0.7,0,Math.PI*2);
    ctx.fill();
  }
}

function drawHero(){
  const {x,y,w,h}=player;
  const px=x+w/2,py=y+h;
  ctx.save();
  ctx.globalAlpha=0.35;
  ctx.fillStyle="#000";
  ctx.beginPath();ctx.ellipse(px,py+4,w*0.35*(1-sq*0.5),6,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(tilt);
  ctx.scale((1-sq*0.6)*dir,1+sq);
  if(heroOk)ctx.drawImage(hero,-w/2,-h,w,h);
  else{ctx.fillStyle="#ff3030";ctx.fillRect(-w/2,-h,w,h)}
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBackground();
  platforms.forEach(p=>{
    const g=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
    g.addColorStop(0,"#ff5050");g.addColorStop(1,"#b00000");
    ctx.fillStyle=g;
    ctx.beginPath();ctx.roundRect(p.x,p.y+p.dip*7,p.w,p.h-p.dip*3,6);ctx.fill();
  });
  particles.forEach(q=>{
    ctx.fillStyle="rgba(255,255,255,"+q.life*0.6+")";
    ctx.beginPath();ctx.arc(q.x,q.y,q.r*q.life,0,Math.PI*2);ctx.fill();
  });
  drawHero();
  ctx.fillStyle="#fff";
  ctx.font="bold "+Math.round(26*(1+pop*0.35))+"px Arial";
  ctx.fillText("Очки: "+score,15,40);
}

function loop(){
  if(running)update();
  draw();
  requestAnimationFrame(loop);
}

document.getElementById("again").addEventListener("click",reset);
reset();
loop();
</script>
